<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rootwaker</title>
    <meta name="description" content="A browser 3D action-adventure game — hunt real animals through a jungle, climb a real mountain, become King, then duel other players in real peer-to-peer combat." />
    <meta name="theme-color" content="#070a08" />
    <!-- iOS has no manifest support — Safari's own "Add to Home Screen" reads these tags
         directly instead. No apple-touch-icon: iOS requires a real PNG, and this project has no
         SVG-to-PNG tooling available (no rsvg-convert/imagemagick/sharp) to generate one — a
         deliberate cut, not an oversight; iOS falls back to a screenshot-based icon instead of
         Android/Chrome/desktop's real manifest icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rootwaker" />
    <meta property="og:title" content="Rootwaker" />
    <meta property="og:description" content="A browser 3D action-adventure game — hunt real animals through a jungle, climb a real mountain, become King, then duel other players in real peer-to-peer combat." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kabirnarang39.github.io/rootwaker/" />
    <!-- A real screenshot of the actual character-select screen, not a generated/stock graphic
         — consistent with this project's own "nothing fake, everything real" ethos. Absolute
         URL required: unlike href/src, Vite doesn't rewrite plain content="" attributes for the
         /rootwaker/ GitHub Pages base path. -->
    <meta property="og:image" content="https://kabirnarang39.github.io/rootwaker/og-image.jpg" />
    <meta property="og:image:width" content="1456" />
    <meta property="og:image:height" content="827" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rootwaker" />
    <meta name="twitter:description" content="A browser 3D action-adventure game — hunt real animals through a jungle, climb a real mountain, become King, then duel other players in real peer-to-peer combat." />
    <meta name="twitter:image" content="https://kabirnarang39.github.io/rootwaker/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #070a08; }
      #app { width: 100vw; height: 100vh; display: block; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
